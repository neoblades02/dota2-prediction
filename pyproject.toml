[project]
name = "dota-predictor"
version = "0.1.0"
description = "Roster-aware, patch-aware predictions for professional Dota 2 matches, with a live dashboard"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.29",
    "tenacity>=8.4,<10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
    "structlog>=24.1,<26",
    "polars>=1.0,<3",
    "numpy>=1.26,<3",
    "lightgbm>=4.3,<6",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-timeout>=2.3,<3",
    "responses>=0.25,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
dota-predictor = "dota_predictor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dota_predictor"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
